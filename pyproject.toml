[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamera-omr"
version = "0.1.0"
description = "Optical music recognition engine built on Gamera (BWV 248)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}
dependencies = ["numpy", "music21", "Pillow", "lxml", "PyYAML"]

[project.scripts]
gamera-omr = "gamera_omr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv", "build", "dist"]
